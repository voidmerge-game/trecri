name: selftest
on:
  push: { branches: [main], paths: ['pipeline/**', 'client/**', 'tests/**', '.github/workflows/selftest.yml'] }
  workflow_dispatch:

permissions: { contents: read }

jobs:
  selftest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: install ffmpeg + fonts + deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core tesseract-ocr
          pip install -q pillow numpy
          ffmpeg -version | head -1
      - name: pipeline tests
        run: python3 tests/run_tests.py
      - name: ffmpeg capabilities required by the pipeline
        run: |
          for f in zoompan lut3d loudnorm subtitles aecho silenceremove; do
            ffmpeg -hide_banner -filters 2>/dev/null | grep -q " $f " && echo "OK   $f" || { echo "MISS $f"; exit 1; }
          done
      - name: no README + rules locked
        run: |
          h=$(find . -path ./.git -prune -o -type f -iname 'readme*' -print); [ -z "$h" ] || { echo "FAIL $h"; exit 1; }
          python3 -c "import json;s=json.load(open('state.json'));assert s['rules']['no_readme_any_format'] and s['rules']['video_analysis_forbidden'];print('rules locked')"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: selftest-outputs, path: "05_edit/*.edl\n05_edit/*.srt", retention-days: 7 }
