name: tools-probe
on:
  workflow_dispatch:
permissions: { contents: read }

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: base deps
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q --upgrade pip
          /tmp/venv/bin/pip install -q "numpy<2"
          # نسخ CPU الرسمية (أخف بكثير من cu132 الموجودة افتراضياً)
          /tmp/venv/bin/pip install -q torch torchvision --index-url https://download.pytorch.org/whl/cpu
          # أساسر يستورد torchvision.transforms.functional_tensor المحذوف في torchvision>=0.17
          # لا توجد نسخة <0.17 لبايثون 3.12 → نصنع شيم (re-export) بدل التخفيض
          /tmp/venv/bin/python - <<'SHIM'
          import os, torchvision
          p = os.path.join(os.path.dirname(torchvision.__file__), "transforms", "functional_tensor.py")
          if not os.path.exists(p):
              open(p, "w").write("from torchvision.transforms.functional import *\n")
          print("shim:", p, os.path.exists(p))
          SHIM
      - name: "A auto-editor (trim silence)"
        continue-on-error: true
        run: |
          /tmp/venv/bin/pip install -q auto-editor
          ffmpeg -y -f lavfi -i "sine=frequency=300:duration=3" -af "volume=0.2" /tmp/a.wav
          ffmpeg -y -f lavfi -i anullsrc=r=48000:cl=mono -t 2 /tmp/sil.wav
          printf "file '/tmp/a.wav'\nfile '/tmp/sil.wav'\nfile '/tmp/a.wav'\n" > /tmp/l.txt
          ffmpeg -y -f concat -safe 0 -i /tmp/l.txt /tmp/in.wav
          /tmp/venv/bin/auto-editor /tmp/in.wav --edit audio:threshold=0.03 --output /tmp/out.wav --no-open
          ffprobe -v error -show_entries format=duration -of csv=p=0 /tmp/in.wav /tmp/out.wav
      - name: "B demucs (stem separation, CPU)"
        continue-on-error: true
        run: |
          /tmp/venv/bin/pip install -q demucs
          ffmpeg -y -f lavfi -i "sine=frequency=440:duration=6" /tmp/song.wav
          /tmp/venv/bin/python -m demucs -n htdemucs --two-stems=vocals -o /tmp/stems /tmp/song.wav
          find /tmp/stems -name "*.wav" | head
      - name: "C iopaint (inpainting)"
        continue-on-error: true
        run: |
          /tmp/venv/bin/pip install -q iopaint
          /tmp/venv/bin/python - <<'PY'
          from PIL import Image, ImageDraw
          im = Image.new("RGB",(512,512),(200,196,186)); d=ImageDraw.Draw(im)
          d.rectangle([180,180,330,330], fill=(30,30,30)); im.save("/tmp/inp.png")
          m = Image.new("L",(512,512),0); ImageDraw.Draw(m).rectangle([170,170,340,340], fill=255); m.save("/tmp/mask.png")
          PY
          /tmp/venv/bin/iopaint run --model=lama --device=cpu --image=/tmp/inp.png --mask=/tmp/mask.png --output=/tmp/inp_out
          ls -la /tmp/inp_out
      - name: "D realesrgan (upscale, cpu attempt)"
        continue-on-error: true
        run: |
          /tmp/venv/bin/pip install -q realesrgan basicsr
          /tmp/venv/bin/python - <<'PY'
          import torch, sys
          print("torch", torch.__version__, "cuda", torch.cuda.is_available())
          from realesrgan import RealESRGANer
          from basicsr.archs.rrdbnet_arch import RRDBNet
          print("imports OK")
          PY
          curl -sL -o /tmp/RRDB.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.1.0/RealESRGAN_x4plus.pth
          ls -la /tmp/RRDB.pth
      - name: "E gfpgan (face restore)"
        continue-on-error: true
        run: |
          /tmp/venv/bin/pip install -q gfpgan
          /tmp/venv/bin/python -c "import gfpgan;print('gfpgan import OK', gfpgan.__file__)"
      - name: "F pedalboard"
        continue-on-error: true
        run: |
          /tmp/venv/bin/pip install -q pedalboard
          /tmp/venv/bin/python - <<'PY'
          from pedalboard import Pedalboard, Reverb
          from pedalboard.io import AudioFile
          import numpy as np
          sr=48000; a=np.zeros((1,sr),dtype=np.float32)
          with AudioFile("/tmp/pb.wav","w",sr,1) as f: f.write(Pedalboard([Reverb(room_size=0.5)])(a,sr))
          print("pedalboard OK")
          PY
      - name: "G chatterbox / bark (TTS)"
        continue-on-error: true
        run: |
          /tmp/venv/bin/pip download chatterbox-tts --no-deps -d /tmp/cb 2>&1 | tail -3 || echo "chatterbox not resolvable"
      - name: summary
        if: always()
        run: echo "probe finished"
